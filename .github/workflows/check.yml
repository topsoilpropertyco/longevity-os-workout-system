# Longevity OS — continuous check
#
# CONTRIBUTING.md says `npm run check` must pass before committing. This is what
# makes that true rather than aspirational.

name: check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: contracts · types · tests · data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci || npm install

      # The three vocabularies — engine unions, Postgres enums, generated db
      # types — drift silently and are cheap to check, so they go first.
      - name: Contract check
        run: npx tsx scripts/check-contracts.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Engine tests
        run: npm run test --workspace=@longevity/engine

      - name: Validate generated data
        run: npx tsx scripts/validate-data.ts

      # 0011_seed_kot.sql is generated from programs/kot/program.json. Hand-
      # editing either one alone puts a step in the database that is not in the
      # program, or the reverse — and nothing at runtime would say so.
      - name: The KOT seed matches the program it is generated from
        run: npx tsx scripts/gen-kot-sql.ts --check

      # A stray `tsc` without an outDir leaves .js beside the .ts sources, where
      # Vite's resolver prefers it and the tests silently run stale code. This
      # has already happened once.
      - name: No stale build artifacts beside sources
        run: |
          found=$(find packages/*/src packages/*/fixtures packages/*/test \( -name '*.js' -o -name '*.d.ts' \) 2>/dev/null | head -20)
          if [ -n "$found" ]; then
            echo "Compiled output found next to TypeScript sources:"; echo "$found"
            echo "These shadow their .ts under Vite. Run 'npm run clean:stale' in packages/engine."
            exit 1
          fi

  migrations:
    name: migrations against real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: longevity
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Supabase supplies the auth schema and the three roles; a bare Postgres
      # does not, so we stub exactly what the migrations reference and nothing
      # more. Running them anywhere else would catch nothing.
      - name: Stub the Supabase-managed objects
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d longevity -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create extension if not exists pgcrypto;
          create table if not exists auth.users (id uuid primary key default gen_random_uuid(), email text);
          create or replace function auth.uid() returns uuid language sql stable as
            $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin bypassrls; end if;
          end $$;
          SQL

      # Twice, in order. A migration that is not idempotent breaks the second
      # time someone runs `supabase db reset` against an existing project.
      - name: Apply migrations, twice
        env:
          PGPASSWORD: postgres
        run: |
          for pass in 1 2; do
            echo "-- pass $pass --"
            for f in supabase/migrations/*.sql; do
              echo "  $(basename "$f")"
              psql -h localhost -U postgres -d longevity -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done

      # THE test this suite was missing. psql gives every statement its own
      # implicit transaction; the Supabase SQL Editor wraps a pasted script in
      # ONE. That difference hid a real failure: `alter type ... add value`
      # followed by a row using that value is legal across two transactions and
      # illegal inside one (SQLSTATE 55P04). It passed here and failed in the
      # editor, in front of the user.
      - name: The one-paste bundle, in a single transaction
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d longevity -c "drop schema public cascade; create schema public;" -q
          for pass in 1 2; do
            echo "-- single-transaction pass $pass --"
            psql -h localhost -U postgres -d longevity -v ON_ERROR_STOP=1 --single-transaction -q \
              -f supabase/SCHEMA_ALL_IN_ONE.sql
          done

      - name: The bundle matches the migrations it is generated from
        run: |
          npm run sql:bundle
          if ! git diff --quiet -- supabase/SCHEMA_ALL_IN_ONE.sql; then
            echo "SCHEMA_ALL_IN_ONE.sql is stale. Run 'npm run sql:bundle' and commit the result."
            git diff --stat -- supabase/SCHEMA_ALL_IN_ONE.sql
            exit 1
          fi
          echo "Bundle is up to date."

      # packages/db/src/types.ts is hand-written until the project is linked and
      # `supabase gen types` can run. A column added to a migration and missed
      # there does not fail the build — it fails at runtime as a field that is
      # quietly undefined. This is the only place that can catch it.
      - name: The db contract matches the schema
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: longevity
        run: npx tsx scripts/check-db-columns.ts

      - name: The program seeded, whole
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d longevity -v ON_ERROR_STOP=1 -tAc "
            select case
              when (select count(*) from program_steps) = 0 then 'no program steps seeded'
              when (select current_phase_id from programs where slug='kot') is null
                then 'kot has no starting phase'
              else ''
            end;" | grep -q '^$' || { echo "The KOT seed did not land."; exit 1; }
          echo "Seeded: $(psql -h localhost -U postgres -d longevity -tAc "
            select (select count(*) from program_steps) || ' steps, '
                || (select jsonb_array_length(phases) from programs where slug='kot') || ' phases, '
                || (select jsonb_array_length(days) from programs where slug='kot') || ' weekday templates';")"

      - name: Enrolling an athlete is idempotent
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d longevity -v ON_ERROR_STOP=1 -q <<'SQL'
          insert into auth.users (id, email) values ('11111111-1111-1111-1111-111111111111','ci@example.com') on conflict do nothing;
          insert into public.users (id, email) values ('11111111-1111-1111-1111-111111111111','ci@example.com') on conflict do nothing;
          select public.start_program('11111111-1111-1111-1111-111111111111','kot');
          select public.start_program('11111111-1111-1111-1111-111111111111','kot');
          do $$
          declare n integer; ph text; wk integer;
          begin
            select count(*), max(phase_id), max(week_in_phase) into n, ph, wk
            from public.program_progress
            where user_id = '11111111-1111-1111-1111-111111111111';
            if n <> 1 then raise exception 'start_program created % progress rows, not 1', n; end if;
            if ph <> 'zero' or wk <> 1 then
              raise exception 'expected zero/week 1, got %/%', ph, wk;
            end if;
          end $$;
          SQL
          echo "start_program is idempotent and starts at Zero, week 1."

      # json → sql → postgres → rows → Program. Three translations, each
      # individually plausible; a mistake in any one shows up not as an error
      # but as an exercise that silently never appears in a session.
      - name: The program survives the round trip
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: longevity
        run: npx tsx scripts/check-program-roundtrip.ts

      - name: Every public table has RLS
        env:
          PGPASSWORD: postgres
        run: |
          missing=$(psql -h localhost -U postgres -d longevity -tAc "
            select coalesce(string_agg(c.relname, ', '), '')
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind = 'r' and not c.relrowsecurity;")
          if [ -n "$missing" ]; then echo "Tables without RLS: $missing"; exit 1; fi
          echo "All public tables have RLS enabled."

      - name: The browser roles cannot claim LLM jobs
        env:
          PGPASSWORD: postgres
        run: |
          leaked=$(psql -h localhost -U postgres -d longevity -tAc "
            select has_function_privilege('anon', 'public.claim_llm_job(text, text[])', 'execute')
                or has_function_privilege('authenticated', 'public.claim_llm_job(text, text[])', 'execute');")
          if [ "$leaked" = "t" ]; then echo "A browser role can claim LLM jobs. It must not."; exit 1; fi
          echo "claim_llm_job is service-key only."
